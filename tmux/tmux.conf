# test
set -g default-shell /usr/bin/fish

set -g prefix `
unbind C-b
bind ` send-prefix

set -g mouse on
set -g mode-keys vi

# Blend the copy-mode cursor into the selection instead of recoloring its
# last character. This RGB value matches yellow in Alacritty's Linux palette.
# Restore inherited cursor settings when returning to the application.
set-hook -g pane-mode-changed[100] {
    if-shell -F '#{==:#{pane_mode},copy-mode}' {
        set -p cursor-style bar
        set -p cursor-colour '#aa5500'
    } {
        set -pu cursor-style
        set -pu cursor-colour
    }
}

# Status line tuned for day-to-day Rust work: keep the left side quiet and show
# command/git/time signals on the right.
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 70
set -g status-right-length 120

# Match Powerlevel10k classic's charcoal segments and blue/green accents.
set -g status-style "bg=default,fg=colour250"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g message-style "bg=colour234,fg=colour39"
set -g mode-style "bg=colour39,fg=colour234"
# Alacritty already shows the current shell context, so keep tmux from
# duplicating session/window labels on the left side of the status bar.
set -g status-left ""
# set -g status-left "#[fg=colour109,bg=colour235] #S "
set -g status-right "#[fg=colour234,bg=default]░▒▓#[bg=colour234]#{?client_prefix,#[bold,fg=colour220] prefix #[nobold],}#{?window_zoomed_flag,#[bold,fg=colour214] zoom #[nobold],}#[fg=colour113] #(/home/inner/.config/tmux/scripts/git-branch \"#{pane_current_path}\") #[fg=colour242]#[fg=colour39] #{user}@#H #[fg=colour242]#[fg=colour250] IP: #(/home/inner/.config/tmux/scripts/ip-address) #[fg=colour242]#[fg=colour250]  %Y-%m-%d %H:%M:%S "

set -g window-status-format ""
set -g window-status-current-format ""
# set -g window-status-format " #I "
# set -g window-status-current-format "#[fg=colour109,bg=colour235] #I "
set -g window-status-separator ""
